# Site
title: Iván Alonso
subtitle: Software engineer
description: "Software projects by Iván Alonso: game engines, developer tools and the web."
author: Iván Alonso
language: en
timezone: Europe/Madrid

# URL
url: https://neverbot.com
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
skip_render:

# Writing
new_post_name: :title.md
default_layout: project
titlecase: false
external_link:
  enable: true
  field: site
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js

# Home index
index_generator:
  path: ''
  per_page: 0
  order_by: -date

# Archives and feeds are not needed in a portfolio
archive_generator:
  enabled: false
tag_generator:
  enabled: false
category_generator:
  enabled: false

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Extensions
theme: portfolio

markdown:
  preset: default
  render:
    html: true
    linkify: true
    typographer: true
    breaks: false
  plugins:
    - markdown-it-attrs

sitemap:
  path:
    - sitemap.xml
  rel: true
